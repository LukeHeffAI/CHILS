# @package _global_
defaults:
  - trainer: default.yaml
  - datamodule: data.yaml
  - models: evaluate.yaml
  - logger: wandb.yaml
  - hydra: default.yaml
  - _self_

work_dir: ${hydra:runtime.cwd}
data_dir: ${data_loc}
log_dir: ${work_dir}/${log_loc}

# path to folder with data
data_loc: "~/Documents/GitHub/data"
log_loc: logs

# Additional hyperparams
seed: 42
source_dataset: "food-101"
arch: "ClipViTB32"
pretrained: True
base_task: "food-101"
num_classes: 101

hydra:
  job:
    chdir: false
